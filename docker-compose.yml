services:
  redis:
    image: redis:6
    ports:
      - "6379:6379"
    restart: always

  app1:
    build: .
    environment:
      - Endpoint=${Endpoint:?Set Endpoint in .env}
      - Database=${Database:?Set Database in .env}
      - Username=${Username:?Set Username in .env}
      - Password=${Password:?Set Password in .env}
      - RedisEndpoint=redis
      - JwtSecret=${JWT_SECRET:-change_me_in_production}
      - SERVER_TOMCAT_THREADS_MAX=600
    depends_on:
      - redis
    restart: on-failure

  app2:
    build: .
    environment:
      - Endpoint=${Endpoint:?Set Endpoint in .env}
      - Database=${Database:?Set Database in .env}
      - Username=${Username:?Set Username in .env}
      - Password=${Password:?Set Password in .env}
      - RedisEndpoint=redis
      - JwtSecret=${JWT_SECRET:-change_me_in_production}
      - SERVER_TOMCAT_THREADS_MAX=600
    depends_on:
      - redis
    restart: on-failure

  app3:
    build: .
    environment:
      - Endpoint=${Endpoint:?Set Endpoint in .env}
      - Database=${Database:?Set Database in .env}
      - Username=${Username:?Set Username in .env}
      - Password=${Password:?Set Password in .env}
      - RedisEndpoint=redis
      - JwtSecret=${JWT_SECRET:-change_me_in_production}
      - SERVER_TOMCAT_THREADS_MAX=600
    depends_on:
      - redis
    restart: on-failure

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
      - app3
    restart: always
